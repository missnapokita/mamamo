<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>Bidamax Player</title>
  <link rel="stylesheet" href="style.css?v=2.2">
</head>
<body>
  <main id="player" class="player">
    <button id="wakeTop" class="wake-zone wake-zone-top" type="button" aria-label="Show player controls"></button>
    <button id="wakeBottom" class="wake-zone wake-zone-bottom" type="button" aria-label="Show player controls"></button>
    <button id="wakeLeft" class="wake-zone wake-zone-left" type="button" aria-label="Show player controls"></button>
    <button id="wakeRight" class="wake-zone wake-zone-right" type="button" aria-label="Show player controls"></button>

    <iframe id="playerFrame" title="Bidamax video" src="about:blank" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>

    <div id="topGradient" class="top-gradient"></div>
    <div id="movieTitle" class="movie-title">Now Playing</div>

    <button id="qualityBtn" class="quality-btn" type="button" hidden>Quality</button>
    <button id="notPlayingBtn" class="not-playing" type="button">Not Playing?</button>
    <div id="qualityPanel" class="quality-panel" role="menu"></div>

    <section id="loading" class="center-state" role="status" aria-live="polite" aria-label="Generating playable link">
      <div class="loading-content">
        <div id="progressRing" class="progress-ring" role="progressbar" aria-label="Playable link generation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <svg class="progress-svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <circle class="progress-track" cx="32" cy="32" r="27" pathLength="100"></circle>
            <circle id="progressCircle" class="progress-value" cx="32" cy="32" r="27" pathLength="100"></circle>
          </svg>
          <span id="progressPercent" class="progress-percent">0%</span>
        </div>
        <div id="loadingText" class="loading-text">Preparing player…</div>
      </div>
    </section>

    <section id="errorBox" class="center-state error-state" hidden>
      <div class="error-title">Unable to load video</div>
      <div id="errorMessage" class="error-sub">The stream is temporarily unavailable.</div>
      <button id="retryBtn" class="retry-btn" type="button">Try again</button>
    </section>
  </main>

  <script src="config.js?v=2.2"></script>
  <script src="player.js?v=2.2"></script>
</body>
</html>
